################################################################
# Splash Sync Bundle for Akeneo PIM — CI/CD Pipeline
#
# Docker      : prebuilt Akeneo 7 & 2026 images (core + assets)
#               -> ci/docker.yaml
# Quality     : BadPixxel SDK GrumPHP suites, per Akeneo version
#               -> ci/quality.yaml
# Functional  : PhpUnit tests on prebuilt Akeneo images
#               -> ci/functional.yaml
#
# Documentation is now published on www.splashsync.com, from src/Resources/docs:
# GitLab Pages job is disabled.
#include:
#  - remote: 'https://raw.githubusercontent.com/BadPixxel/Php-Sdk/main/gitlab/pages.yaml'
################################################################

################################################################
# Set any variables we need
variables:
    # Configure mysql environment variables (https://hub.docker.com/r/_/mysql/)
    MYSQL_DATABASE:                 akeneo_pim
    MYSQL_ROOT_PASSWORD:            akeneo_pim
    MYSQL_USER:                     akeneo_pim
    MYSQL_PASSWORD:                 akeneo_pim
    COMPOSER_MEMORY_LIMIT:          -1
    # Akeneo pins dependencies flagged by security advisories: do not block them
    COMPOSER_NO_SECURITY_BLOCKING:  1
    SYMFONY_DEPRECATIONS_HELPER:    disabled

################################################################
# Defined Pipeline Stages
stages:
    - Docker
    - Quality
    - Functional

include:
    - local:    ci/docker.yaml
    - local:    ci/quality.yaml
    - local:    ci/functional.yaml
